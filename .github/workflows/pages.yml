name: SDK documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs artifact
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - name: Verify repository policy
        run: python3 scripts/check_repository.py --ref "$GITHUB_SHA"
      - name: Generate public reference
        run: |
          node scripts/generate-pages.js
          git diff --exit-code -- docs/
          python3 scripts/check_distribution.py --stage-docs build/pages-site
          python3 scripts/check_repository.py --artifact-dir build/pages-site
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - name: Upload verified public files
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/pages-site

  deploy:
    name: Deploy SDK documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
