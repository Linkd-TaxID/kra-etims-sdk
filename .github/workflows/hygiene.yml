name: Repository hygiene

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test policy rejection boundaries
        run: python3 scripts/tests/test_repository_policy.py
      - name: Inspect complete candidate tree
        run: python3 scripts/check_repository.py --ref "$GITHUB_SHA"
      - name: Install checksum-pinned Gitleaks 8.30.1
        run: |
          curl --fail --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan candidate content with redacted findings
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source" \
            --config .github/gitleaks.toml --ignore-gitleaks-allow \
            --gitleaks-ignore-path /dev/null --max-target-megabytes 2 \
            --redact=100 --no-banner --timeout 120
